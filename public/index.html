<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<title>Health</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --font: 'Geist', -apple-system, 'Helvetica Neue', sans-serif;
  --font-num: 'Geist Mono', ui-monospace, Menlo, monospace;
  --bg: #F1F1F0; --surface: #FAFAF9; --surface-2: #F4F4F2;
  --ink: #141414; --ink-soft: #6F6F6C; --ink-3: #A7A7A3;
  --hair: rgba(20,20,20,0.08); --fill: rgba(20,20,20,0.05);
  --teal: #306F75; --on-teal: #FFFFFF;
  /* Ultrahuman's own tag colours */
  --opt: #00B984; --good: #E3CD77; --bad: #F94264; --none: #BDBDB8;
  --opt-ink: #0B7F5C; --good-ink: #7C6B12; --bad-ink: #C42046;
  --c-grid: #E2E2DF; --c-axis: #76766F;
  --s-deep: #306F75; --s-light: #8EC3C0; --s-rem: #949CDD; --s-awake: #D97A2B;
  --c-hr: #E4527A; --c-hrv: #306F75; --c-temp: #D97A2B; --c-pace: #306F75; --c-alt: #BDBDB8;
  --nav-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B0C0C; --surface: #17191A; --surface-2: #202324;
    --ink: #EDEEEC; --ink-soft: #A3A6A2; --ink-3: #6E716D;
    --hair: rgba(237,238,236,0.09); --fill: rgba(237,238,236,0.07);
    --teal: #6BB9B6; --on-teal: #0B1A1A;
    --opt-ink: #3FD3A6; --good-ink: #E3CD77; --bad-ink: #FF7A93;
    --c-grid: #2A2D2E; --c-axis: #8E918D;
    --s-deep: #4F9C98; --s-light: #2F6460; --s-rem: #8E96E0; --s-awake: #E8964F;
    --c-hrv: #6BB9B6; --c-pace: #6BB9B6; --c-alt: #55595B;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.lbl { font: 500 10px/1.2 var(--font-num); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }

/* login */
#login { display: none; min-height: 100dvh; align-items: center; justify-content: center; padding: 24px; }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 16px; }
.login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; padding: 22px; }
.login-card h1 { margin: 0; font-size: 26px; font-weight: 700; }
input { font: inherit; color: var(--ink); background: var(--fill); border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; width: 100%; }
.pill { background: var(--teal); color: var(--on-teal); border-radius: 999px; padding: 12px 18px; font-weight: 600; text-align: center; }
.error { color: var(--bad-ink); font-size: 13px; font-weight: 600; min-height: 18px; }

/* shell */
#app { display: none; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0) + 18px); }
.page { display: none; padding: 14px 14px 0; max-width: 760px; margin: 0 auto; }
.page.on { display: block; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px 14px; }
.head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.sub { color: var(--ink-soft); font-size: 12px; }
.datebar { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 34px; height: 34px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); display: grid; place-items: center; font-size: 15px; }
.iconbtn[disabled] { opacity: .35; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0)); padding-bottom: env(safe-area-inset-bottom, 0);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--hair); }
#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font: 500 10px var(--font-num); letter-spacing: .05em; text-transform: uppercase; }
#tabs button.on { color: var(--ink); }
#tabs svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* score tiles */
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.score { padding: 14px 10px 12px; text-align: center; }
.score .big { font: 600 34px/1 var(--font-num); margin: 8px 0 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--none); vertical-align: middle; }
.tag { font: 500 11px var(--font); color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
.tile .v { font: 600 22px/1.1 var(--font-num); display: flex; align-items: baseline; gap: 5px; }
.tile .u { font: 400 12px var(--font); color: var(--ink-soft); }
.tile .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.delta { font: 500 11px var(--font-num); color: var(--ink-soft); }
.section { margin: 18px 2px 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-soft); font-size: 14px; }

/* charts */
.chartcard { padding: 12px 12px 8px; margin-bottom: 12px; }
.chartcard .top { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 6px; gap: 8px; }
.chartcard .read { font: 500 12px var(--font-num); color: var(--ink); min-height: 15px; text-align: right; }
svg.ch { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
svg.ch text { font-family: var(--font-num); font-size: 9.5px; fill: var(--c-axis); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); font: 500 11px var(--font-num); letter-spacing: .03em; color: var(--ink-soft); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 4px 0; font: 400 11px var(--font); color: var(--ink-soft); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* runs */
.runrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; text-align: left; width: 100%; margin-bottom: 8px; }
.runrow .t { font-weight: 600; font-size: 14px; }
.runrow .m { font: 500 12px var(--font-num); color: var(--ink-soft); text-align: right; }
.runrow .d { color: var(--ink-soft); font-size: 12px; }
.src { font: 500 9px var(--font-num); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--fill); color: var(--ink-soft); margin-left: 6px; vertical-align: 1px; }
#detail { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; display: none; padding-top: env(safe-area-inset-top, 0); }
#detail .inner { max-width: 760px; margin: 0 auto; padding: 10px 14px calc(30px + env(safe-area-inset-bottom, 0)); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.stat { padding: 10px 12px; }
.stat .v { font: 600 18px var(--font-num); margin-top: 4px; }
.signout { color: var(--ink-3); font: 500 11px var(--font-num); letter-spacing: .05em; text-transform: uppercase; padding: 18px 2px; }
</style>
</head>
<body>

<div id="login">
  <div class="card login-card">
    <h1>Health</h1>
    <input type="email" id="login-email" placeholder="Email" autocomplete="username">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button class="pill" id="login-btn" type="button">Sign in</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <section class="page on" id="p-today"></section>
  <section class="page" id="p-sleep"></section>
  <section class="page" id="p-trends"></section>
  <section class="page" id="p-runs"></section>
  <nav id="tabs">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button data-tab="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
    <button data-tab="trends"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>Trends</button>
    <button data-tab="runs"><svg viewBox="0 0 24 24"><path d="M13 4a1.5 1.5 0 1 0 0 .01M6 21l3-6 3 2 2-5-3-2-3 2-3-1M14 12l4 2"/></svg>Runs</button>
  </nav>
</div>
<div id="detail"><div class="inner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>

  // ---------- Bands ----------

  // ---------- Metrics ----------

    deep_min: { l: 'Deep sleep', f: hm }, rem_min: { l: 'REM sleep', f: hm },

  // ---------- State ----------
  var S = { daily: [], byDate: {}, acts: [], date: null, trendKey: 'sleep_score', range: 90, nightCache: {} };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dot(level) { return '<span class="dot" style="background:' + COLORS[level] + '"></span>'; }
  function fmtDay(ds) { var d = new Date(ds + 'T12:00:00'); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
  function addDays(ds, n) { var d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

  function avg(a) { a = a.filter(function (x) { return x != null; }); return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }
  function recent(key, date, n) { var out = []; for (var i = 1; i <= n; i++) { var r = S.byDate[addDays(date, -i)]; if (r && r[key] != null) out.push(Number(r[key])); } return out; }

  // ---------- Chart kit (SVG, no dependencies) ----------
  var NS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  /* cfg: {w,h,series:[{pts:[[x,y]],color,width,dots,fill}],xFmt,yFmt,yMin,yMax,bands:[{from,to,color,op}],readout:fn(x,seriesIdx,y)} */
  function lineChart(host, cfg) {

    var all = []; cfg.series.forEach(function (s) { s.pts.forEach(function (p) { if (p[1] != null) all.push(p); }); });

      var tx = sv('text', { x: P.l - 5, y: sy(t) + 3, 'text-anchor': 'end' }, svg); tx.textContent = cfg.yFmt ? cfg.yFmt(t) : t; });

      if (s.fill && d) sv('path', { d: d + 'L' + sx(s.pts[s.pts.length - 1][0]) + ' ' + sy(y0) + 'L' + sx(s.pts[0][0]) + ' ' + sy(y0) + 'Z', fill: s.color, opacity: .1 }, svg);
      if (d) sv('path', { d: d, fill: 'none', stroke: s.color, 'stroke-width': s.width || 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: s.opacity || 1 }, svg);

    });

    h('div', { class: 'top' }, [h('span', { class: 'lbl' }, [title]), read]), host]);
    if (legendHtml) c.appendChild(h('div', { class: 'legend', html: legendHtml })); c.read = read; c.host = host; return c; }

  // ---------- Today ----------
  function renderToday() {
    var p = $('p-today'); p.innerHTML = ''; var r = S.byDate[S.date];
    var prev = h('button', { class: 'iconbtn', 'aria-label': 'Previous day', onclick: function () { stepDay(-1); } }, ['‹']);
    var next = h('button', { class: 'iconbtn', 'aria-label': 'Next day', onclick: function () { stepDay(1); } }, ['›']);
