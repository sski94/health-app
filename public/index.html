<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<title>Health</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --font: 'Geist', -apple-system, 'Helvetica Neue', sans-serif;
  --font-num: 'Geist Mono', ui-monospace, Menlo, monospace;
  --bg: #F1F1F0; --surface: #FAFAF9; --surface-2: #F4F4F2;
  --ink: #141414; --ink-soft: #6F6F6C; --ink-3: #A7A7A3;
  --hair: rgba(20,20,20,0.08); --fill: rgba(20,20,20,0.05);
  --teal: #306F75; --on-teal: #FFFFFF; --accent2: #D97A2B;
  --opt: #00B984; --good: #E3CD77; --bad: #F94264; --none: #BDBDB8;
  --opt-ink: #0B7F5C; --good-ink: #7C6B12; --bad-ink: #C42046;
  --c-grid: #E2E2DF; --c-axis: #76766F;
  --s-deep: #306F75; --s-light: #8EC3C0; --s-rem: #949CDD; --s-awake: #D97A2B;
  --c-hr: #E4527A; --c-hrv: #306F75; --c-temp: #D97A2B; --c-alt: #BDBDB8;
  --nav-h: 56px; --side-w: 204px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B0C0C; --surface: #17191A; --surface-2: #202324;
    --ink: #EDEEEC; --ink-soft: #A3A6A2; --ink-3: #6E716D;
    --hair: rgba(237,238,236,0.09); --fill: rgba(237,238,236,0.07);
    --teal: #6BB9B6; --on-teal: #0B1A1A; --accent2: #E8964F;
    --opt-ink: #3FD3A6; --good-ink: #E3CD77; --bad-ink: #FF7A93;
    --c-grid: #2A2D2E; --c-axis: #8E918D;
    --s-deep: #4F9C98; --s-light: #2F6460; --s-rem: #8E96E0; --s-awake: #E8964F;
    --c-hrv: #6BB9B6; --c-alt: #55595B;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
select, input, textarea { font: inherit; color: var(--ink); background: var(--fill); border: 1px solid var(--hair); border-radius: 10px; padding: 9px 11px; width: 100%; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.lbl { font: 500 10px/1.2 var(--font-num); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 14px; }
.sub { color: var(--ink-soft); font-size: 12px; }
.note { color: var(--ink-soft); font-size: 12px; line-height: 1.45; margin: 8px 2px; }

/* login */
#login { display: none; min-height: 100dvh; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; padding: 22px; }
.login-card h1 { margin: 0; font-size: 26px; font-weight: 700; }
.pill { background: var(--teal); color: var(--on-teal); border-radius: 999px; padding: 11px 18px; font-weight: 600; text-align: center; }
.pill.ghost { background: var(--fill); color: var(--ink); }
.error { color: var(--bad-ink); font-size: 13px; font-weight: 600; min-height: 18px; }

/* shell */
#app { display: none; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0) + 18px); }
.page { display: none; padding: 12px 12px 0; max-width: 780px; margin: 0 auto; }
.page.on { display: block; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px 12px; }
.head h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.datebar { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 32px; height: 32px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); display: grid; place-items: center; font-size: 15px; }
.iconbtn[disabled] { opacity: .35; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0)); padding-bottom: env(safe-area-inset-bottom, 0);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--hair); }
#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font: 500 8px var(--font-num); letter-spacing: .04em; text-transform: uppercase; }
#tabs button.on { color: var(--ink); }
#tabs svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#brand { display: none; }

/* tiles */
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.score { padding: 12px 8px 10px; text-align: center; }
.score .big { font: 600 32px/1 var(--font-num); margin: 8px 0 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--none); vertical-align: middle; }
.tag { font: 500 11px var(--font); color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { padding: 11px 12px; display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; }
.tile .v { font: 600 21px/1.1 var(--font-num); display: flex; align-items: baseline; gap: 5px; }
.tile .u { font: 400 12px var(--font); color: var(--ink-soft); }
.tile .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tile .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.delta { font: 500 11px var(--font-num); color: var(--ink-soft); }
svg.spark { width: 64px; height: 20px; flex: none; }
.scorespark { margin-top: 6px; display: flex; justify-content: center; }
.scorespark svg.spark { width: 90%; height: 26px; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink-soft); font-size: 14px; }

/* charts and controls */
.chartcard { padding: 11px 11px 6px; margin-bottom: 10px; min-width: 0; }
.chartcard .top { display: flex; justify-content: space-between; align-items: baseline; margin: 0 3px 4px; gap: 8px; }
.chartcard .read { font: 500 12px var(--font-num); min-height: 15px; text-align: right; }
svg.ch { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
svg.ch text { font-family: var(--font-num); font-size: 9.5px; fill: var(--c-axis); }
svg.ch text.ev { fill: var(--ink-soft); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; font-size: 9px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 9px; }
.chip { padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); font: 500 11px var(--font-num); letter-spacing: .02em; color: var(--ink-soft); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 2px 4px 2px; font: 400 11px var(--font); color: var(--ink-soft); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.ctl { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 10px; flex-wrap: wrap; }
.ctl input[type=range] { padding: 0; height: 24px; flex: 1; min-width: 120px; accent-color: var(--teal); background: none; border: 0; }
.ctl .val { font: 600 12px var(--font-num); min-width: 62px; text-align: right; }
.formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.formrow.three { grid-template-columns: 1fr 1fr 1fr; }
.cols { display: grid; gap: 10px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.stat { padding: 9px 11px; }
.stat .v { font: 600 17px var(--font-num); margin-top: 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { text-align: left; font: 500 10px var(--font-num); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); padding: 4px 6px; }
table.t td { padding: 6px; border-top: 1px solid var(--hair); }
table.t td.n { font-family: var(--font-num); text-align: right; white-space: nowrap; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--fill); }
.bar { height: 6px; border-radius: 3px; background: var(--fill); position: relative; min-width: 70px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.rate { display: flex; gap: 6px; }
.rate button { flex: 1; padding: 9px 0; border-radius: 10px; background: var(--fill); border: 1px solid var(--hair); font: 600 14px var(--font-num); }
.rate button.on { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.runrow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 10px 12px; text-align: left; width: 100%; margin-bottom: 7px; }
.runrow.sel { outline: 2px solid var(--teal); }
.runrow .t { font-weight: 600; font-size: 13px; }
.runrow .m { font: 500 12px var(--font-num); color: var(--ink-soft); text-align: right; }
.runrow .d { color: var(--ink-soft); font-size: 12px; }
.src { font: 500 9px var(--font-num); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--fill); color: var(--ink-soft); margin-left: 6px; vertical-align: 1px; }
#detail { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; display: none; padding-top: env(safe-area-inset-top, 0); }
#detail .inner { max-width: 780px; margin: 0 auto; padding: 10px 12px calc(30px + env(safe-area-inset-bottom, 0)); }
.signout { color: var(--ink-3); font: 500 11px var(--font-num); letter-spacing: .05em; text-transform: uppercase; padding: 16px 2px; }
.x { color: var(--ink-3); font-size: 16px; padding: 0 6px; }
.hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.hscroll svg { display: block; touch-action: pan-x pan-y; }
svg.hm text { font-family: var(--font-num); font-size: 9.5px; fill: var(--c-axis); }
svg.hm text.ev { fill: var(--ink-soft); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; font-size: 9px; }
.swatches { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 8px 3px 2px; font: 400 11px var(--font); color: var(--ink-soft); }
.swatches i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }

/* desktop: left rail, wide pages, multi-column grids */
@media (min-width: 900px) {
  body { padding-left: var(--side-w); }
  #app { padding-bottom: 30px; }
  #tabs { top: 0; bottom: 0; right: auto; left: 0; width: var(--side-w); height: auto; flex-direction: column; justify-content: flex-start; align-items: stretch;
    padding: 14px 10px; gap: 2px; border-top: 0; border-right: 1px solid var(--hair); background: var(--surface); backdrop-filter: none; }
  #brand { display: block; font: 700 17px var(--font); padding: 6px 12px 16px; }
  #tabs button { flex: none; flex-direction: row; justify-content: flex-start; gap: 11px; padding: 9px 12px; border-radius: 10px; font: 500 13px var(--font); letter-spacing: 0; text-transform: none; color: var(--ink-soft); }
  #tabs button:hover { background: var(--fill); }
  #tabs button.on { background: var(--fill); color: var(--ink); }
  .page { max-width: 1400px; padding: 22px 28px 0; }
  .head h1 { font-size: 24px; }
  .scores { grid-template-columns: repeat(3, 1fr); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .cols.c2 { grid-template-columns: 1fr 1fr; }
  .cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .cols.side { grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); }
  .cols.act { grid-template-columns: 380px minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(6, 1fr); }
  .stats.s3 { grid-template-columns: repeat(3, 1fr); }
  .chartcard { margin-bottom: 0; }
  .cols > .card, .cols > div > .card { margin-bottom: 10px; }
}
</style>
</head>
<body>

<div id="login">
  <div class="card login-card">
    <h1>Health</h1>
    <input type="email" id="login-email" placeholder="Email" autocomplete="username">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button class="pill" id="login-btn" type="button">Sign in</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <section class="page on" id="p-today"></section>
  <section class="page" id="p-sleep"></section>
  <section class="page" id="p-trends"></section>
  <section class="page" id="p-compare"></section>
  <section class="page" id="p-heat"></section>
  <section class="page" id="p-activity"></section>
  <section class="page" id="p-log"></section>
  <nav id="tabs">
    <div id="brand">Health</div>
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button data-tab="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
    <button data-tab="trends"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>Trends</button>
    <button data-tab="compare"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2"/><circle cx="16" cy="9" r="2"/><circle cx="11" cy="16" r="2"/><circle cx="18" cy="17" r="1.5"/><path d="M3 21V3"/><path d="M3 21h18"/></svg>Compare</button>
    <button data-tab="heat"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Heatmap</button>
    <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M13 4a1.5 1.5 0 1 0 0 .01M6 21l3-6 3 2 2-5-3-2-3 2-3-1M14 12l4 2"/></svg>Activity</button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Log</button>
  </nav>
</div>
<div id="detail"><div class="inner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';
  // The publishable key is meant to be public. Access control is Supabase Auth plus row-level
  // security on every health_* table (signed-in users only).
  var SUPABASE_URL = 'https://dnwcfrvjqdfledhsvizn.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_7MbQqqkWKGfMRdi3SdJ_CA_qpFmhbjT';
  var supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var TZ = 'Europe/London';
  var Z2 = [125, 145]; // Zone 2 band from the training plan

  // ================= Bands =================
  // Ultrahuman's own labels (stored per day in health_uh_daily.bands) are used wherever the API supplies one.
  // The three headline scores are not banded in the API, so these cut-offs are an assumption: change them here.
  var SCORE_BANDS = { optimal: 80, good: 60 };
  var COLORS = { opt: 'var(--opt)', good: 'var(--good)', bad: 'var(--bad)', none: 'var(--none)' };
  var LABEL = { opt: 'Optimal', good: 'Good', bad: 'Needs attention', none: '' };
  function scoreLevel(v) { if (v == null) return 'none'; return v >= SCORE_BANDS.optimal ? 'opt' : v >= SCORE_BANDS.good ? 'good' : 'bad'; }
  function tagLevel(t) { t = String(t || '').toLowerCase(); if (!t) return 'none';
    if (/optimal|within range|excellent/.test(t)) return 'opt'; if (/good|elevated|fair|ok/.test(t)) return 'good';
    if (/attention|warning|poor|low|high/.test(t)) return 'bad'; return 'none'; }
  function stateLevel(s) { return s === 'optimal' ? 'opt' : s === 'good' ? 'good' : s === 'warning' ? 'bad' : 'none'; }
  function band(r, key) { var b = r.bands || {}, x;
    switch (key) {
      case 'sleep_score': case 'recovery_index': case 'movement_index': return scoreLevel(r[key]);
      case 'total_sleep_min': x = b['badge:total_sleep'] || b.total_sleep; return x ? tagLevel(x.tag) : 'none';
      case 'time_in_bed_min': x = b['badge:time_in_bed'] || b.time_in_bed; return x ? tagLevel(x.tag) : 'none';
      case 'restorative_pct': x = b['badge:restorative_sleep'] || b.sleep_hr_factor; return x ? tagLevel(x.tag) : 'none';
      case 'efficiency': x = b['contrib:Sleep Efficiency']; return x ? stateLevel(x.state) : 'none';
      case 'temp_dev_c': x = b['contrib:Temperature']; return x ? stateLevel(x.state) : 'none';
    } return 'none'; }

  // ================= Metrics =================
  function hm(min) { if (min == null) return '-'; min = Math.round(min); return Math.floor(min / 60) + 'h ' + String(min % 60).padStart(2, '0') + 'm'; }
  function r0(v) { return Math.round(v); }
  function r1(v) { return Number(v).toFixed(1); }
  function clock(v) { v = ((v % 24) + 24) % 24; var h_ = Math.floor(v), m_ = Math.round((v - h_) * 60); if (m_ === 60) { h_ = (h_ + 1) % 24; m_ = 0; } return String(h_).padStart(2, '0') + ':' + String(m_).padStart(2, '0'); }
  function paceStr(s) { return Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0'); }
  // group: uh (daily from Ultrahuman), load (from activities), ci (check-in). better: +1 higher is better, -1 lower is better.
  var MET = [
    { k: 'sleep_score', l: 'Sleep score', f: r0, better: 1, g: 'Sleep' },
    { k: 'recovery_index', l: 'Recovery', f: r0, better: 1, g: 'Scores' },
    { k: 'movement_index', l: 'Movement', f: r0, better: 1, g: 'Scores' },
    { k: 'avg_hrv', l: 'HRV', u: 'ms', f: r0, better: 1, g: 'Heart' },
    { k: 'sleep_rhr', l: 'Resting HR', u: 'bpm', f: r0, better: -1, g: 'Heart' },
    { k: 'avg_hr', l: 'Avg HR (sleep)', u: 'bpm', f: r0, g: 'Heart' },
    { k: 'total_sleep_min', l: 'Total sleep', f: hm, better: 1, g: 'Sleep' },
    { k: 'time_in_bed_min', l: 'Time in bed', f: hm, g: 'Sleep' },
    { k: 'efficiency', l: 'Sleep efficiency', u: '%', f: r0, better: 1, g: 'Sleep' },
    { k: 'restorative_pct', l: 'Restorative', u: '%', f: r0, better: 1, g: 'Sleep' },
    { k: 'deep_min', l: 'Deep sleep', f: hm, g: 'Sleep' },
    { k: 'rem_min', l: 'REM sleep', f: hm, g: 'Sleep' },
    { k: 'light_min', l: 'Light sleep', f: hm, g: 'Sleep' },
    { k: 'awake_min', l: 'Awake in bed', f: hm, better: -1, g: 'Sleep' },
    { k: 'cycles_full', l: 'Sleep cycles', f: r0, g: 'Sleep' },
    { k: 'bedtime', l: 'Bedtime', f: clock, g: 'Sleep' },
    { k: 'wake', l: 'Wake time', f: clock, g: 'Sleep' },
    { k: 'temp_dev_c', l: 'Skin temp vs usual', u: '°C', f: function (v) { return (v > 0 ? '+' : '') + r1(v); }, g: 'Body' },
    { k: 'avg_body_temp_c', l: 'Body temp', u: '°C', f: r1, g: 'Body' },
    { k: 'spo2', l: 'SpO2 (avg)', u: '%', f: r0, g: 'Body' },
    { k: 'vo2_max', l: 'VO2 max', f: r0, better: 1, g: 'Fitness' },
    { k: 'steps', l: 'Steps', f: function (v) { return Math.round(v).toLocaleString('en-GB'); }, better: 1, g: 'Activity' },
    { k: 'run_km', l: 'Run distance (day)', u: 'km', f: r1, sum: true, g: 'Training' },
    { k: 'run_km_7d', l: 'Run km, last 7 days', u: 'km', f: r1, g: 'Training' },
    { k: 'run_km_28d', l: 'Run km per week, last 28 days', u: 'km', f: r1, g: 'Training' },
    { k: 'ride_km', l: 'Ride distance (day)', u: 'km', f: r1, sum: true, g: 'Training' },
    { k: 'ride_km_7d', l: 'Ride km, last 7 days', u: 'km', f: r1, g: 'Training' },
    { k: 'active_min', l: 'Training time (day)', u: 'min', f: r0, sum: true, g: 'Training' },
    { k: 'active_min_7d', l: 'Training min, last 7 days', u: 'min', f: r0, g: 'Training' },
    { k: 'activity', l: 'Activity day (1 = yes)', f: r0, sum: true, g: 'Training' },
    { k: 'load', l: 'Training load (day)', u: 'pts', f: r0, sum: true, g: 'Training' },
    { k: 'load_7d', l: 'Training load, last 7 days', u: 'pts', f: r0, g: 'Training' },
