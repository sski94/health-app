name: Activities sync

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "sync/activities_sync.py"
  workflow_dispatch: {}

concurrency:
  group: activities-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fitdecode
      - name: Load activities into Supabase
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 -u activities_sync.py
